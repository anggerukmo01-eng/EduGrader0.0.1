<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGrader AI - Elegan & Modern</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            background-color: #e2e8f0;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }

        /* Kaca buram estetik */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="antialiased text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            School: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 22v-4a2 2 0 1 0-4 0v4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M18 5v17"/><path d="m4 6 8-4 8 4"/><path d="M6 5v17"/><circle cx="12" cy="9" r="2"/></svg>,
            Image: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
            Database: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            BookOpen: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>,
            UploadCloud: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>,
            Loader2: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            Table: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="3" x2="21" y1="15" y2="15"/><line x1="9" x2="9" y1="9" y2="21"/><line x1="15" x2="15" y1="9" y2="21"/></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
            Monitor: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>,
            Tablet: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>,
            Smartphone: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>,
        };

        const defaultApiKey = "AIzaSyBEyhGHnkHK4p3ciSLG9VUowrncmk8LlJU";
        
        const defaultStudents = [
          { nisn: '3186088743', name: 'ATHA ZAFRAN RAMADHAN', jk: 'L' },
          { nisn: '3184668441', name: 'CAKRA ABIYASA', jk: 'L' },
          { nisn: '3198245070', name: 'DELIA ZAHRA SALSABILA', jk: 'P' },
          { nisn: '3182191613', name: 'ELVANO AKMAL DWITAMA', jk: 'L' },
          { nisn: '3180097773', name: 'FAJAR ASKARI RAMDANI', jk: 'L' },
          { nisn: '3190609374', name: 'FARRA AYSHA AZZAHRA', jk: 'P' },
          { nisn: '3196928983', name: 'FAUZIAH HASNI FAIQ SYARIF', jk: 'P' },
          { nisn: '3176829400', name: 'FELLISA PUTRI HIDAYAT', jk: 'P' },
          { nisn: '3194416472', name: 'GHALI NUFAIL TSAMARADANIE', jk: 'L' },
          { nisn: '3181245719', name: 'GILANG ARJUNA RAMADHAN', jk: 'L' },
          { nisn: '3185432764', name: 'HAFIT RAMADHANI SAFUTRA', jk: 'L' },
          { nisn: '3198630567', name: 'KESYA LUTFIA ALHANISPUTRI', jk: 'P' },
          { nisn: '3180176114', name: 'MAULANA YUSUF ALFARIZQI', jk: 'L' },
          { nisn: '3185715005', name: 'MUHAMMAD ABDILAH MUZAQI', jk: 'L' },
          { nisn: '3195455121', name: 'RAFASYA ALVIN FAAZ', jk: 'L' },
          { nisn: '3195732811', name: 'RANDY PRASETYA', jk: 'L' },
          { nisn: '3197098742', name: 'RIVANDRA LUJA ANUGRAH', jk: 'L' },
          { nisn: '3180556733', name: 'WISNU ARYA KENCANA', jk: 'L' },
          { nisn: '3194871087', name: 'YUSUF AFKA RIANSYAH', jk: 'L' }
        ];

        const subjectsList = ['PPKn', 'Bahasa Indonesia', 'Matematika', 'Seni Rupa', 'Bahasa Jawa'];

        function App() {
            // State Inti
            const [activeTab, setActiveTab] = useState('beranda');
            const [viewMode, setViewMode] = useState('desktop');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            
            // State Pengaturan & Data
            const [settings, setSettings] = useState({
                apiKey: defaultApiKey,
                schoolName: 'SD Negeri 1 Gerduren',
                schoolYear: '2025/2026',
                grade: '1',
                teacherName: 'Nama Guru Anda, S.Pd.',
                logo: '', // Base64
                background: '' // Base64
            });
            const [students, setStudents] = useState(defaultStudents);
            const [records, setRecords] = useState([]);
            const [answerKeys, setAnswerKeys] = useState({
                'PPKn': '', 'Bahasa Indonesia': '', 'Matematika': '', 'Seni Rupa': '', 'Bahasa Jawa': ''
            });

            // State Formulir
            const [newStudent, setNewStudent] = useState({ nisn: '', name: '', jk: 'L' });
            const [subject, setSubject] = useState('PPKn');
            const [selectedStudentNisn, setSelectedStudentNisn] = useState('');
            const [imagePreview, setImagePreview] = useState(null);
            const [base64Image, setBase64Image] = useState(null);
            const [mimeType, setMimeType] = useState(null);
            const [loading, setLoading] = useState(false);
            
            // Modal Detail
            const [selectedRecord, setSelectedRecord] = useState(null);
            const [toastMessage, setToastMessage] = useState('');

            const fileInputRef = useRef(null);
            const logoInputRef = useRef(null);
            const bgInputRef = useRef(null);
            const restoreInputRef = useRef(null);

            // Load data dari localStorage (opsional, jika ingin persisten)
            useEffect(() => {
                const saved = localStorage.getItem('eduGraderData');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if(parsed.settings) setSettings(parsed.settings);
                        if(parsed.students) setStudents(parsed.students);
                        if(parsed.records) setRecords(parsed.records);
                        if(parsed.answerKeys) setAnswerKeys(parsed.answerKeys);
                    } catch(e) { console.error("Gagal load data lokal"); }
                }
            }, []);

            // Save ke localStorage tiap ada perubahan
            useEffect(() => {
                localStorage.setItem('eduGraderData', JSON.stringify({ settings, students, records, answerKeys }));
            }, [settings, students, records, answerKeys]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const handleImageUpload = (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64String = reader.result;
                    if (type === 'exam') {
                        setImagePreview(base64String);
                        setBase64Image(base64String.split(',')[1]);
                        setMimeType(file.type);
                    } else if (type === 'logo') {
                        setSettings({...settings, logo: base64String});
                    } else if (type === 'bg') {
                        setSettings({...settings, background: base64String});
                    }
                };
                reader.readAsDataURL(file);
            };

            const triggerFileInput = (ref) => ref.current && ref.current.click();

            const gradeExam = async () => {
                if (!base64Image) return showToast('Unggah foto jawaban dahulu!');
                if (!selectedStudentNisn) return showToast('Pilih siswa dahulu!');

                setLoading(true);
                const currentKey = answerKeys[subject] || "Gunakan standar kurikulum pendidikan dasar untuk menilai.";
                
                const prompt = `
Kamu adalah ${settings.teacherName}, guru kelas ${settings.grade} di ${settings.schoolName}. 
Tugasmu mengoreksi lembar jawaban siswa (mata pelajaran: ${subject}).
Kunci Jawaban: ${currentKey}

Tugas:
1. Baca teks pada gambar.
2. Cocokkan dengan kunci jawaban.
3. Beri nilai 0-100 pada baris PERTAMA dengan format persis: NILAI_AKHIR: [angka]
4. Di baris berikutnya, jabarkan Analisis Jawaban (mana yang benar/salah).
5. Berikan Saran singkat.`;

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${settings.apiKey}`;
                    const payload = {
                        contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: mimeType || "image/jpeg", data: base64Image } }] }]
                    };

                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error('API Error');
                    
                    const data = await response.json();
                    if (data?.candidates?.[0]?.content?.parts?.[0]?.text) {
                        const textResp = data.candidates[0].content.parts[0].text;
                        const scoreMatch = textResp.match(/NILAI_AKHIR[^\d]*(\d+)/i);
                        const score = scoreMatch ? parseInt(scoreMatch[1], 10) : 0;
                        const student = students.find(s => s.nisn === selectedStudentNisn);
                        
                        const newRecord = {
                            id: Date.now(),
                            timestamp: new Date().toLocaleString('id-ID'),
                            subject,
                            studentId: student.nisn,
                            studentName: student.name,
                            score,
                            feedback: textResp.replace(/NILAI_AKHIR[^\n]*\n/i, '').trim()
                        };
                        setRecords([newRecord, ...records]);
                        showToast('Koreksi berhasil disimpan ke Daftar Nilai!');
                        // Reset image
                        setImagePreview(null);
                        setBase64Image(null);
                        setSelectedStudentNisn('');
                    }
                } catch (err) {
                    showToast('Gagal terhubung ke AI. Cek koneksi atau API Key.');
                } finally {
                    setLoading(false);
                }
            };

            const downloadWord = (record) => {
                const content = `
Laporan Hasil Koreksi
======================
Sekolah       : ${settings.schoolName}
Tahun Ajaran  : ${settings.schoolYear}
Kelas         : ${settings.grade}
Guru Kelas    : ${settings.teacherName}
----------------------
Waktu Koreksi : ${record.timestamp}
Mata Pelajaran: ${record.subject}
Nama Siswa    : ${record.studentName}
NISN          : ${record.studentId}
NILAI AKHIR   : ${record.score}
----------------------
Detail Analisis AI:
${record.feedback}
                `;
                const blob = new Blob([content], { type: 'application/msword' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Laporan_${record.studentName}_${record.subject}.doc`;
                link.click();
            };

            const backupData = () => {
                const data = JSON.stringify({ settings, students, records, answerKeys });
                const blob = new Blob([data], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Backup_EduGrader_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
            };

            const handleRestoreData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if(parsed.settings) setSettings(parsed.settings);
                        if(parsed.students) setStudents(parsed.students);
                        if(parsed.records) setRecords(parsed.records);
                        if(parsed.answerKeys) setAnswerKeys(parsed.answerKeys);
                        showToast('Data berhasil dipulihkan dari file backup!');
                    } catch (err) {
                        showToast('Gagal memulihkan data. Format file tidak valid.');
                    }
                };
                reader.readAsText(file);
                // Reset input agar bisa pilih file yang sama berulang kali
                e.target.value = null;
            };

            const renderWrapper = (children) => {
                if (viewMode === 'desktop') return <div className="w-full min-h-screen">{children}</div>;
                
                const isTablet = viewMode === 'tablet';
                return (
                    <div className="min-h-screen bg-slate-200 py-8 flex items-center justify-center">
                        <div className={`bg-white shadow-2xl relative overflow-hidden flex flex-col
                            ${isTablet ? 'w-[834px] h-[1112px] max-h-[85vh] rounded-[2rem] border-[12px] border-slate-800' 
                                       : 'w-[390px] h-[844px] max-h-[85vh] rounded-[3rem] border-[14px] border-slate-800'}`}>
                            {/* Notch for mobile simulate */}
                            {!isTablet && <div className="absolute top-0 inset-x-0 h-6 bg-slate-800 rounded-b-2xl w-32 mx-auto z-50"></div>}
                            <div className="flex-1 overflow-y-auto custom-scrollbar relative">
                                {children}
                            </div>
                        </div>
                    </div>
                );
            };

            return renderWrapper(
                <div className="relative min-h-full bg-slate-50 flex flex-col text-slate-800 font-sans">
                    
                    {/* Pesan Toast */}
                    {toastMessage && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 fade-in">
                            <Icons.Check /> <span className="text-sm font-medium">{toastMessage}</span>
                        </div>
                    )}

                    {/* Navigasi Utama */}
                    <nav className="bg-white/80 backdrop-blur-xl border-b border-slate-200 sticky top-0 z-30 px-4 md:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                                <Icons.Check />
                            </div>
                            <div>
                                <h1 className="text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-700 to-blue-600">EduGrader</h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">AI Powered</p>
                            </div>
                        </div>

                        <div className="flex bg-slate-100 p-1.5 rounded-2xl flex-1 md:flex-none overflow-x-auto custom-scrollbar">
                            {[
                                { id: 'beranda', icon: Icons.Home, label: 'Beranda' },
                                { id: 'koreksi', icon: Icons.Image, label: 'Koreksi' },
                                { id: 'nilai', icon: Icons.Table, label: 'Daftar Nilai' },
                                { id: 'database', icon: Icons.Database, label: 'Database' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center justify-center gap-2 px-4 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${
                                        activeTab === tab.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'
                                    }`}
                                >
                                    <tab.icon />
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <button onClick={() => setIsSettingsOpen(true)} className="p-2.5 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-indigo-600 transition-colors">
                            <Icons.Settings />
                        </button>
                    </nav>

                    {/* Konten Tab Dinamis */}
                    <main className="flex-1 p-4 md:p-8 w-full max-w-7xl mx-auto">
                        
                        {/* TAB 1: BERANDA */}
                        {activeTab === 'beranda' && (
                            <div className="animate-in fade-in space-y-8">
                                <div className="relative w-full rounded-3xl overflow-hidden shadow-2xl min-h-[400px] flex items-center bg-slate-900 group">
                                    {/* Latar Belakang */}
                                    <div className="absolute inset-0 z-0">
                                        {settings.background ? (
                                            <img src={settings.background} alt="Background" className="w-full h-full object-cover opacity-60" />
                                        ) : (
                                            <div className="w-full h-full bg-gradient-to-br from-indigo-900 via-blue-900 to-slate-900 opacity-80">
                                                {/* Pattern SVG Bawaan */}
                                                <svg className="absolute inset-0 w-full h-full opacity-20" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="a" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 40 40 0H20L0 20M40 40V20L20 40" fill="none" stroke="currentColor" stroke-width="2"/></pattern></defs><rect width="100%" height="100%" fill="url(#a)"/></svg>
                                            </div>
                                        )}
                                    </div>

                                    {/* Konten Hero */}
                                    <div className="relative z-10 w-full p-8 md:p-12 flex flex-col md:flex-row items-center gap-8 text-white">
                                        <div className="shrink-0">
                                            {settings.logo ? (
                                                <img src={settings.logo} alt="Logo" className="w-32 h-32 md:w-48 md:h-48 object-contain drop-shadow-2xl" />
                                            ) : (
                                                <div className="w-32 h-32 md:w-48 md:h-48 bg-white/10 backdrop-blur-md rounded-full border-4 border-white/20 p-4 flex items-center justify-center shadow-2xl">
                                                    <Icons.School />
                                                </div>
                                            )}
                                        </div>
                                        <div className="text-center md:text-left space-y-4">
                                            <div className="inline-block px-4 py-1.5 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-sm font-bold tracking-widest text-blue-100 uppercase mb-2">
                                                Tahun Pelajaran {settings.schoolYear}
                                            </div>
                                            <h2 className="text-4xl md:text-6xl font-black tracking-tight leading-tight drop-shadow-lg">
                                                {settings.schoolName}
                                            </h2>
                                            <p className="text-xl md:text-2xl text-blue-100 font-medium max-w-2xl drop-shadow-md">
                                                Kelas {settings.grade} • Wali Kelas: {settings.teacherName}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-start gap-4 hover:shadow-md transition-shadow">
                                        <div className="p-3 bg-blue-50 text-blue-600 rounded-2xl"><Icons.Users /></div>
                                        <div><h3 className="font-bold text-lg">{students.length}</h3><p className="text-slate-500 text-sm font-medium">Siswa Terdaftar</p></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-start gap-4 hover:shadow-md transition-shadow">
                                        <div className="p-3 bg-indigo-50 text-indigo-600 rounded-2xl"><Icons.Table /></div>
                                        <div><h3 className="font-bold text-lg">{records.length}</h3><p className="text-slate-500 text-sm font-medium">Koreksi Selesai</p></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-start gap-4 hover:shadow-md transition-shadow">
                                        <div className="p-3 bg-emerald-50 text-emerald-600 rounded-2xl"><Icons.BookOpen /></div>
                                        <div><h3 className="font-bold text-lg">{subjectsList.length}</h3><p className="text-slate-500 text-sm font-medium">Mata Pelajaran</p></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: KOREKSI UJIAN */}
                        {activeTab === 'koreksi' && (
                            <div className="animate-in fade-in">
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                    
                                    {/* Panel Kiri: Input */}
                                    <div className="lg:col-span-5 space-y-6">
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                            <h3 className="font-bold text-lg mb-5 flex items-center gap-2"><Icons.User /> Pengaturan Koreksi</h3>
                                            
                                            <div className="space-y-5">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Mata Pelajaran</label>
                                                    <select value={subject} onChange={(e) => setSubject(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 outline-none font-medium text-slate-700">
                                                        {subjectsList.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Pilih Siswa</label>
                                                    <select value={selectedStudentNisn} onChange={(e) => setSelectedStudentNisn(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 outline-none font-medium text-slate-700">
                                                        <option value="" disabled>-- Pilih dari Database --</option>
                                                        {students.map(std => <option key={std.nisn} value={std.nisn}>{std.name}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                                                        Kunci Jawaban ({subject})
                                                    </label>
                                                    <textarea 
                                                        value={answerKeys[subject] || ''}
                                                        onChange={(e) => setAnswerKeys({...answerKeys, [subject]: e.target.value})}
                                                        placeholder="Opsional: Tuliskan kunci atau rubrik..."
                                                        className="w-full h-32 p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 outline-none resize-none font-medium text-sm text-slate-700"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Panel Kanan: Upload & Aksi */}
                                    <div className="lg:col-span-7 space-y-6">
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-full flex flex-col">
                                            <h3 className="font-bold text-lg mb-5 flex items-center gap-2"><Icons.Image /> Foto Lembar Jawaban</h3>
                                            
                                            <input type="file" accept="image/*" ref={fileInputRef} className="hidden" onChange={(e) => handleImageUpload(e, 'exam')} />
                                            
                                            <div onClick={() => triggerFileInput(fileInputRef)} className={`flex-1 min-h-[300px] border-2 border-dashed rounded-3xl flex flex-col items-center justify-center cursor-pointer transition-all ${imagePreview ? 'border-transparent bg-slate-100 p-2' : 'border-slate-300 hover:border-indigo-500 hover:bg-slate-50'}`}>
                                                {imagePreview ? (
                                                    <img src={imagePreview} alt="Preview" className="w-full h-full object-contain rounded-2xl" />
                                                ) : (
                                                    <div className="text-center text-slate-500 space-y-2">
                                                        <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4"><Icons.UploadCloud /></div>
                                                        <p className="font-bold">Klik untuk Mengunggah Foto</p>
                                                        <p className="text-xs">Mendukung file JPG & PNG</p>
                                                    </div>
                                                )}
                                            </div>

                                            <button 
                                                onClick={gradeExam} 
                                                disabled={loading || !base64Image || !selectedStudentNisn}
                                                className={`mt-6 w-full py-4 rounded-2xl font-bold text-white shadow-xl transition-all flex items-center justify-center gap-2 text-lg
                                                    ${loading || !base64Image || !selectedStudentNisn ? 'bg-slate-300 shadow-none' : 'bg-gradient-to-r from-indigo-600 to-blue-600 hover:-translate-y-1 hover:shadow-indigo-500/30'}`}
                                            >
                                                {loading ? <><Icons.Loader2 /> Sedang Mengoreksi...</> : 'Koreksi Otomatis Sekarang'}
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}

                        {/* TAB 3: DAFTAR NILAI */}
                        {activeTab === 'nilai' && (
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 animate-in fade-in">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 border-b border-slate-100 pb-4">
                                    <h2 className="text-xl font-bold flex items-center gap-2"><Icons.Table /> Filter Daftar Nilai</h2>
                                    <div className="flex gap-3">
                                        <select value={subject} onChange={(e) => setSubject(e.target.value)} className="p-2 border border-slate-300 rounded-xl bg-slate-50 font-medium text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                                            {subjectsList.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                        <button onClick={downloadExcel} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2 text-sm shadow-sm transition-all"><Icons.Download /> Ekspor CSV</button>
                                    </div>
                                </div>

                                <div className="overflow-x-auto rounded-2xl border border-slate-100">
                                    <table className="w-full text-left border-collapse whitespace-nowrap">
                                        <thead className="bg-slate-50 text-slate-600 text-sm">
                                            <tr>
                                                <th className="p-4 font-bold border-b">Waktu</th>
                                                <th className="p-4 font-bold border-b">NISN</th>
                                                <th className="p-4 font-bold border-b">Nama Siswa</th>
                                                <th className="p-4 font-bold border-b text-center">Nilai</th>
                                                <th className="p-4 font-bold border-b text-center">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {records.filter(r => r.subject === subject).length === 0 ? (
                                                <tr><td colSpan="5" className="p-8 text-center text-slate-400 font-medium">Belum ada data nilai untuk mata pelajaran ini.</td></tr>
                                            ) : records.filter(r => r.subject === subject).map(record => (
                                                <tr key={record.id} className="hover:bg-slate-50 border-b border-slate-50 text-sm">
                                                    <td className="p-4 text-slate-500">{record.timestamp}</td>
                                                    <td className="p-4 font-medium text-slate-700">{record.studentId}</td>
                                                    <td className="p-4 font-bold text-slate-800">{record.studentName}</td>
                                                    <td className="p-4 text-center">
                                                        <span className={`px-3 py-1 rounded-full font-black text-xs ${record.score >= 75 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{record.score}</span>
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        <button onClick={() => setSelectedRecord(record)} className="p-2 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 transition-colors inline-flex"><Icons.Eye /></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: DATABASE SISWA */}
                        {activeTab === 'database' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-in fade-in">
                                <div className="lg:col-span-1">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 sticky top-24">
                                        <h3 className="font-bold text-lg mb-5 flex items-center gap-2"><Icons.Plus /> Tambah Siswa</h3>
                                        <form onSubmit={(e) => { e.preventDefault(); if(newStudent.nisn && newStudent.name){ setStudents([...students, newStudent]); setNewStudent({nisn:'', name:'', jk:'L'}); showToast('Siswa ditambahkan!'); } }} className="space-y-4">
                                            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">NISN</label><input type="text" required value={newStudent.nisn} onChange={e => setNewStudent({...newStudent, nisn: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl" /></div>
                                            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nama</label><input type="text" required value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value.toUpperCase()})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl" /></div>
                                            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">L/P</label><select value={newStudent.jk} onChange={e => setNewStudent({...newStudent, jk: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
                                            <button type="submit" className="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-md transition-colors">Simpan</button>
                                        </form>
                                    </div>
                                </div>
                                <div className="lg:col-span-2">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                        <div className="flex justify-between items-center mb-5"><h3 className="font-bold text-lg">Data Master Siswa</h3><span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold">{students.length} Siswa</span></div>
                                        <div className="overflow-x-auto max-h-[600px] overflow-y-auto custom-scrollbar rounded-xl border border-slate-100">
                                            <table className="w-full text-left border-collapse text-sm">
                                                <thead className="bg-slate-50 sticky top-0"><tr className="text-slate-600"><th className="p-3">No</th><th className="p-3">NISN</th><th className="p-3">Nama</th><th className="p-3 text-center">L/P</th></tr></thead>
                                                <tbody>{students.map((s,i) => <tr key={i} className="border-t border-slate-100 hover:bg-slate-50"><td className="p-3 text-slate-400">{i+1}</td><td className="p-3 font-medium">{s.nisn}</td><td className="p-3 font-bold">{s.name}</td><td className="p-3 text-center">{s.jk}</td></tr>)}</tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL PENGATURAN */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white w-full max-w-2xl max-h-[90vh] overflow-y-auto custom-scrollbar rounded-[2rem] shadow-2xl">
                                <div className="sticky top-0 bg-white/90 backdrop-blur-md px-6 py-4 border-b flex justify-between items-center z-10">
                                    <h2 className="text-xl font-bold flex items-center gap-2"><Icons.Settings /> Pengaturan Sistem</h2>
                                    <button onClick={() => setIsSettingsOpen(false)} className="p-2 bg-slate-100 rounded-full hover:bg-slate-200"><Icons.X /></button>
                                </div>
                                <div className="p-6 space-y-8">
                                    
                                    <section>
                                        <h3 className="text-sm font-bold text-indigo-600 uppercase tracking-widest mb-4">Mode Tampilan</h3>
                                        <div className="flex gap-4">
                                            <button onClick={() => setViewMode('desktop')} className={`flex-1 p-4 rounded-2xl border-2 flex flex-col items-center gap-2 transition-all ${viewMode === 'desktop' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-500 hover:border-slate-300'}`}><Icons.Monitor /><span className="text-xs font-bold">Desktop</span></button>
                                            <button onClick={() => setViewMode('tablet')} className={`flex-1 p-4 rounded-2xl border-2 flex flex-col items-center gap-2 transition-all ${viewMode === 'tablet' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-500 hover:border-slate-300'}`}><Icons.Tablet /><span className="text-xs font-bold">Tablet (11")</span></button>
                                            <button onClick={() => setViewMode('mobile')} className={`flex-1 p-4 rounded-2xl border-2 flex flex-col items-center gap-2 transition-all ${viewMode === 'mobile' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-500 hover:border-slate-300'}`}><Icons.Smartphone /><span className="text-xs font-bold">Mobile</span></button>
                                        </div>
                                    </section>

                                    <section>
                                        <h3 className="text-sm font-bold text-indigo-600 uppercase tracking-widest mb-4">Identitas & Visual</h3>
                                        <div className="grid grid-cols-2 gap-4 mb-4">
                                            <div><label className="block text-xs font-bold text-slate-500 mb-1">Nama Sekolah</label><input type="text" value={settings.schoolName} onChange={e => setSettings({...settings, schoolName: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" /></div>
                                            <div><label className="block text-xs font-bold text-slate-500 mb-1">Nama Guru</label><input type="text" value={settings.teacherName} onChange={e => setSettings({...settings, teacherName: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" /></div>
                                            <div><label className="block text-xs font-bold text-slate-500 mb-1">Tahun Pelajaran</label><input type="text" value={settings.schoolYear} onChange={e => setSettings({...settings, schoolYear: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" /></div>
                                            <div><label className="block text-xs font-bold text-slate-500 mb-1">Kelas</label><input type="text" value={settings.grade} onChange={e => setSettings({...settings, grade: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" /></div>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <input type="file" accept="image/*" ref={logoInputRef} className="hidden" onChange={(e) => handleImageUpload(e, 'logo')} />
                                                <button onClick={() => triggerFileInput(logoInputRef)} className="w-full p-3 border-2 border-dashed border-slate-300 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-50 flex items-center justify-center gap-2"><Icons.Image /> Ubah Logo</button>
                                            </div>
                                            <div className="flex-1">
                                                <input type="file" accept="image/*" ref={bgInputRef} className="hidden" onChange={(e) => handleImageUpload(e, 'bg')} />
                                                <button onClick={() => triggerFileInput(bgInputRef)} className="w-full p-3 border-2 border-dashed border-slate-300 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-50 flex items-center justify-center gap-2"><Icons.Image /> Ubah Latar</button>
                                            </div>
                                        </div>
                                    </section>
                                    
                                    <section>
                                        <h3 className="text-sm font-bold text-indigo-600 uppercase tracking-widest mb-4">Sistem & Backup</h3>
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1">Gemini API Key</label><input type="password" value={settings.apiKey} onChange={e => setSettings({...settings, apiKey: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono" /></div>
                                        
                                        <div className="flex gap-4 mt-4">
                                            <button onClick={backupData} className="flex-1 p-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors text-sm"><Icons.Download /> Backup Data</button>
                                            
                                            <input type="file" accept=".json" ref={restoreInputRef} className="hidden" onChange={handleRestoreData} />
                                            <button onClick={() => triggerFileInput(restoreInputRef)} className="flex-1 p-3 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors text-sm"><Icons.UploadCloud /> Restore Data</button>
                                        </div>
                                        <p className="text-xs text-slate-500 mt-2">Gunakan Backup & Restore untuk memindahkan data antar perangkat secara aman.</p>
                                    </section>
                                </div>
                                
                                {/* Tombol Simpan Pengaturan */}
                                <div className="sticky bottom-0 bg-white/90 backdrop-blur-md px-6 py-4 border-t flex justify-end gap-3 z-10 rounded-b-[2rem]">
                                    <button onClick={() => setIsSettingsOpen(false)} className="px-6 py-2.5 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition-colors">Tutup</button>
                                    <button 
                                        onClick={() => { 
                                            setIsSettingsOpen(false); 
                                            showToast('Pengaturan & API Key berhasil disimpan!'); 
                                        }} 
                                        className="px-6 py-2.5 rounded-xl font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-md transition-colors flex items-center gap-2"
                                    >
                                        <Icons.Check /> Simpan Pengaturan
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* MODAL DETAIL LAPORAN SISWA */}
                    {selectedRecord && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white w-full max-w-3xl max-h-[90vh] flex flex-col rounded-[2rem] shadow-2xl overflow-hidden">
                                <div className="bg-slate-50 px-6 py-4 border-b flex justify-between items-center">
                                    <div>
                                        <h2 className="text-xl font-black">{selectedRecord.studentName}</h2>
                                        <p className="text-sm text-slate-500 font-medium">Mapel: {selectedRecord.subject} • {selectedRecord.timestamp}</p>
                                    </div>
                                    <button onClick={() => setSelectedRecord(null)} className="p-2 bg-slate-200 rounded-full hover:bg-slate-300"><Icons.X /></button>
                                </div>
                                <div className="flex-1 p-6 overflow-y-auto custom-scrollbar">
                                    <div className="flex items-center justify-center gap-4 mb-8">
                                        <div className="text-center">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Nilai Akhir AI</p>
                                            <div className={`text-6xl font-black ${selectedRecord.score >= 75 ? 'text-green-500' : 'text-red-500'}`}>{selectedRecord.score}</div>
                                        </div>
                                    </div>
                                    <div className="prose prose-slate max-w-none text-sm font-medium whitespace-pre-wrap bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                        {selectedRecord.feedback}
                                    </div>
                                </div>
                                <div className="p-4 border-t bg-slate-50">
                                    <button onClick={() => downloadWord(selectedRecord)} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md flex items-center justify-center gap-2"><Icons.Download /> Unduh Laporan MS Word</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
