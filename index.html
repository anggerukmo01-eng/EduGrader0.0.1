            const [selectedRecord, setSelectedRecord] = useState(null);

            // Load data dari localStorage
            useEffect(() => {
                const saved = localStorage.getItem('eduGraderData');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.settings) {
                            // Memaksa pembaruan jika memori masih menyimpan API Key OpenAI yang lama atau kosong

                    } catch(e) { console.error("Gagal load data lokal"); }
                }
            }, []);

            // Save ke localStorage
            useEffect(() => {

            }, [settings, students, records, answerKeys]);

            const showToast = (msg, type = 'success') => {
                setToastMessage(msg);
                setToastType(type);
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleImageUpload = (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64String = reader.result;
                    if (type === 'exam') {
                        setImagePreview(base64String);
                        setBase64Image(base64String.split(',')[1]);
                        setMimeType(file.type);
                    } else if (type === 'logo') {
                        setSettings({...settings, logo: base64String});
                    } else if (type === 'bg') {
                        setSettings({...settings, background: base64String});
                    }
                };
                reader.readAsDataURL(file);
            };

            const triggerFileInput = (ref) => ref.current && ref.current.click();

            const gradeExam = async () => {
                if (!settings.apiKey) return showToast('Peringatan: API Key OpenAI belum diatur di Pengaturan!', 'error');
                
                // Validasi API Key OpenAI
                if (!settings.apiKey.startsWith('sk-')) {
                     showToast('Format API Key Salah! API Key OpenAI yang asli selalu diawali dengan "sk-". Silakan cek pengaturan Anda.', 'error');
                     setIsSettingsOpen(true);
                     return;
                }
                
                if (!base64Image) return showToast('Unggah foto jawaban dahulu!', 'error');
                if (!selectedStudentNisn) return showToast('Pilih siswa dahulu!', 'error');

                setLoading(true);
                const currentKey = answerKeys[subject] || "Gunakan standar kurikulum pendidikan dasar untuk menilai secara objektif berdasarkan penalaran yang logis.";
                
                const prompt = `
Kamu adalah ${settings.teacherName}, guru kelas ${settings.grade} di ${settings.schoolName}. 
Tugasmu mengoreksi lembar jawaban siswa (mata pelajaran: ${subject}).
Kunci Jawaban: ${currentKey}

Tugas:
1. Baca teks pada gambar dengan cermat.
2. Cocokkan dengan kunci jawaban.
3. Beri nilai 0-100 pada baris PERTAMA dengan format persis: NILAI_AKHIR: [angka]
4. Di baris berikutnya, jabarkan Analisis Jawaban secara rinci (mana yang benar/salah dan berikan alasan pedagogis singkat).
5. Berikan Saran konstruktif dan menyemangati untuk siswa.`;

                try {
                    // Endpoint OpenAI API
                    const url = 'https://api.openai.com/v1/chat/completions';
                    
                    const payload = {
                        model: "gpt-4o",
                        messages: [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: prompt },
                                    { 
                                        type: "image_url", 
                                        image_url: { 
                                            url: `data:${mimeType || "image/jpeg"};base64,${base64Image}` 
                                        } 
                                    }
                                ]
                            }
                        ],
                        max_tokens: 1500
                    };

                    const response = await fetch(url, { 
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${settings.apiKey}`
                        }, 
                        body: JSON.stringify(payload) 
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        const errorMsg = errorData.error?.message || `HTTP Error ${response.status}`;
                        throw new Error(errorMsg);
                    }
                    
                    const data = await response.json();
                    if (data?.choices?.[0]?.message?.content) {
                        const textResp = data.choices[0].message.content;
                        const scoreMatch = textResp.match(/NILAI_AKHIR[^\d]*(\d+)/i);
                        const score = scoreMatch ? parseInt(scoreMatch[1], 10) : 0;
                        const student = students.find(s => s.nisn === selectedStudentNisn);
                        
                        const newRecord = {
                            id: Date.now(),
                            timestamp: new Date().toLocaleString('id-ID'),
                            subject,
                            studentId: student.nisn,
                            studentName: student.name,
                            score,
                            feedback: textResp.replace(/NILAI_AKHIR[^\n]*\n/i, '').trim()
                        };
                        setRecords([newRecord, ...records]);
                        showToast('Koreksi berhasil disimpan ke Daftar Nilai!', 'success');
                        
                        setImagePreview(null);
                        setBase64Image(null);
                        setSelectedStudentNisn('');
                    } else {
                        throw new Error('Respon dari AI tidak valid atau kosong.');
                    }
                } catch (err) {
                    showToast(`Gagal terhubung ke AI: ${err.message}`, 'error');
                } finally {
                    setLoading(false);
                }
            };

                const content = `Laporan Hasil Koreksi\n======================\nSekolah       : ${settings.schoolName}\nTahun Ajaran  : ${settings.schoolYear}\nKelas         : ${settings.grade}\nGuru Kelas    : ${settings.teacherName}\n----------------------\nWaktu Koreksi : ${record.timestamp}\nMata Pelajaran: ${record.subject}\nNama Siswa    : ${record.studentName}\nNISN          : ${record.studentId}\nNILAI AKHIR   : ${record.score}\n----------------------\nDetail Analisis Guru (AI):\n\n${record.feedback}`;
                const blob = new Blob([content], { type: 'application/msword' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Laporan_${record.studentName.replace(/\s+/g, '_')}_${record.subject}.doc`;
                link.click();
            };
            
            const downloadExcel = () => {
                if (records.length === 0) return;
                const headers = ['Waktu', 'Mata Pelajaran', 'NISN', 'Nama Siswa', 'Nilai Akhir'];
                const csvContent = [headers.join(','), ...records.filter(r => r.subject === subject).map(r => `"${r.timestamp}","${r.subject}","${r.studentId}","${r.studentName}","${r.score}"`)].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Rekap_Nilai_${subject}_${settings.schoolName.replace(/\s+/g, '_')}.csv`;
                link.click();
            };

            const backupData = () => {
                const data = JSON.stringify({ settings, students, records, answerKeys });
                const blob = new Blob([data], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Backup_EduGrader_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
            };

            const handleRestoreData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if(parsed.settings) setSettings(parsed.settings);
                        if(parsed.students) setStudents(parsed.students);
                        if(parsed.records) setRecords(parsed.records);
                        if(parsed.answerKeys) setAnswerKeys(parsed.answerKeys);
                        showToast('Data berhasil dipulihkan dari file backup!');
                    } catch (err) {
                        showToast('Gagal memulihkan data. Format file tidak valid.', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const renderWrapper = (children) => {
                if (viewMode === 'desktop') return (
                    <div className="w-full min-h-screen bg-[#f8fafc] relative overflow-x-hidden">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-200/40 mix-blend-multiply filter blur-[100px] opacity-70 animate-blob pointer-events-none z-0"></div>
                        <div className="absolute top-[20%] right-[-10%] w-[30%] h-[50%] rounded-full bg-blue-200/40 mix-blend-multiply filter blur-[100px] opacity-70 animate-blob pointer-events-none animation-delay-2000 z-0"></div>
                        <div className="relative z-10 w-full min-h-screen flex flex-col">{children}</div>
                    </div>
                );
                
                const isTablet = viewMode === 'tablet';
                return (
                    <div className="min-h-screen bg-slate-200 py-10 flex items-center justify-center relative overflow-hidden">
                        <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob pointer-events-none"></div>
                        
                        <div className={`relative bg-[#f8fafc] shadow-2xl overflow-hidden flex flex-col transition-all duration-500 ease-in-out
                            ${isTablet ? 'w-[834px] h-[1112px] max-h-[85vh] rounded-[2.5rem] border-[14px] border-slate-800 shadow-[0_0_0_1px_rgba(255,255,255,0.1)_inset,0_25px_50px_-12px_rgba(0,0,0,0.5)]' 
                                       : 'w-[390px] h-[844px] max-h-[85vh] rounded-[3rem] border-[14px] border-slate-800 shadow-[0_0_0_1px_rgba(255,255,255,0.1)_inset,0_25px_50px_-12px_rgba(0,0,0,0.5)]'}`}>
                            
                            <div className="absolute top-0 inset-x-0 flex justify-center z-50 pointer-events-none">
                                {isTablet ? (
                                    <div className="h-4 w-4 rounded-full bg-slate-900 mt-2 flex items-center justify-center shadow-inner"><div className="h-1 w-1 rounded-full bg-blue-900/50"></div></div>
                                ) : (
                                    <div className="h-7 w-32 bg-slate-800 rounded-b-3xl flex items-end justify-center pb-1"><div className="h-1 w-12 bg-slate-700/50 rounded-full"></div></div>
                                )}
                            </div>
                            
                            <div className="flex-1 overflow-y-auto custom-scrollbar relative z-10">
                                {children}
                            </div>
                        </div>
                    </div>
                );
            };

            return renderWrapper(
                <>
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-[100] backdrop-blur-md text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 fade-in border ${toastType === 'error' ? 'bg-rose-600/95 border-rose-500' : 'bg-slate-800/95 border-slate-700'}`}>
                            {toastType === 'error' ? <Icons.X /> : <Icons.Check />} 
                            <span className="text-sm font-semibold tracking-wide">{toastMessage}</span>
                        </div>
                    )}

                    {/* Navigation Bar */}
                    <nav className="glass-panel sticky top-0 z-40 px-4 md:px-8 py-3 mx-0 md:mx-4 mt-0 md:mt-4 md:rounded-3xl flex flex-wrap items-center justify-between gap-4 transition-all">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-tr from-indigo-600 to-blue-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-200 text-white">
                                <Icons.Check />
                            </div>
                            <div>
                                <h1 className="text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-800 to-blue-600 tracking-tight">EduGrader</h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">OpenAI Powered</p>
                            </div>
                        </div>

                        <div className="flex bg-slate-100/80 p-1.5 rounded-2xl flex-1 md:flex-none overflow-x-auto custom-scrollbar border border-slate-200/50 backdrop-blur-sm">
                            {[
                                { id: 'beranda', icon: Icons.Home, label: 'Beranda' },
                                { id: 'koreksi', icon: Icons.Image, label: 'Koreksi' },
                                { id: 'nilai', icon: Icons.Table, label: 'Daftar Nilai' },
                                { id: 'database', icon: Icons.Database, label: 'Database' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all whitespace-nowrap duration-300 ${
                                        activeTab === tab.id ? 'bg-white text-indigo-600 shadow-sm border border-slate-200/50' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'
                                    }`}
                                >
                                    <tab.icon />
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <button onClick={() => setIsSettingsOpen(true)} className="p-3 rounded-2xl bg-white/50 border border-slate-200 text-slate-600 hover:bg-white hover:text-indigo-600 transition-all shadow-sm hover:shadow-md">
                            <Icons.Settings />
                        </button>
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 p-4 md:p-8 w-full max-w-7xl mx-auto z-10 relative">
                        
                        {/* Peringatan Keamanan API Key Kosong atau Salah Format */}
                        {(!settings.apiKey || !settings.apiKey.startsWith('sk-')) && (
                            <div className="mb-6 animate-in fade-in bg-rose-50 border border-rose-200 p-4 sm:p-5 rounded-[2rem] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-sm">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center shrink-0">
                                        <Icons.AlertCircle />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-rose-800 text-lg">Konfigurasi API Key Dibutuhkan</h3>
                                        <p className="text-rose-600/80 text-sm font-medium">Anda harus menggunakan API Key dari OpenAI yang diawali dengan <b>"sk-"</b>.</p>
                                    </div>
                                </div>
                                <button onClick={() => setIsSettingsOpen(true)} className="w-full sm:w-auto px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition-all shadow-md active:scale-95 whitespace-nowrap">
                                    Perbarui API Key
                                </button>
                            </div>
                        )}

                        {}
                        {activeTab === 'beranda' && (
                            <div className="animate-in fade-in space-y-8">
                                <div className="relative w-full rounded-[2.5rem] overflow-hidden modern-shadow min-h-[420px] flex items-center group bg-slate-900">
                                    <div className="absolute inset-0 z-0">
                                        {settings.background ? (
                                            <>
                                                <img src={settings.background} alt="Background" className="w-full h-full object-cover opacity-70 group-hover:scale-105 transition-transform duration-1000 ease-out" />
                                                <div className="absolute inset-0 bg-gradient-to-r from-slate-900/90 via-slate-900/60 to-transparent"></div>
                                            </>

                                            <div className="w-full h-full bg-gradient-to-br from-slate-900 via-indigo-900 to-blue-900 opacity-90">
                                                <svg className="absolute inset-0 w-full h-full opacity-10 mix-blend-overlay" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="a" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 40 40 0H20L0 20M40 40V20L20 40" fill="none" stroke="currentColor" stroke-width="2"/></pattern></defs><rect width="100%" height="100%" fill="url(#a)"/></svg>
                                            </div>

                                    </div>

                                    <div className="relative z-10 w-full p-6 sm:p-8 md:p-14 flex flex-col md:flex-row items-center md:items-start gap-6 md:gap-10 text-white">
                                        <div className="shrink-0 relative">
                                            <div className="absolute -inset-4 rounded-full bg-white/5 backdrop-blur-3xl animate-pulse"></div>
                                            {settings.logo ? (
                                                <img src={settings.logo} alt="Logo" className="relative z-10 w-32 h-32 md:w-40 md:h-40 lg:w-48 lg:h-48 object-contain drop-shadow-2xl rounded-3xl" />

                                                <div className="relative z-10 w-32 h-32 md:w-40 md:h-40 lg:w-48 lg:h-48 bg-white/10 backdrop-blur-xl rounded-[2rem] border border-white/20 flex items-center justify-center shadow-2xl">
                                                    <Icons.School />
                                                </div>
                                            )}
                                        </div>
                                        <div className="text-center md:text-left space-y-4 pt-2 md:pt-4 w-full">
                                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-xs font-bold tracking-widest text-blue-100 uppercase shadow-lg">
                                                <span className="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                                                Tahun Pelajaran {settings.schoolYear}

                                                {settings.schoolName}

                                            <div className="space-y-1">
                                                <p className="text-lg md:text-xl lg:text-2xl text-blue-100/90 font-medium drop-shadow-md">
                                                    Kelas {settings.grade}
                                                </p>
                                                <p className="text-base md:text-lg text-slate-200 font-medium flex items-center justify-center md:justify-start gap-2">
                                                    <Icons.User /> {settings.teacherName}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="modern-card p-6 rounded-[2rem] flex items-center gap-5">
                                        <div className="p-4 bg-blue-50 text-blue-600 rounded-2xl"><Icons.Users /></div>
                                        <div><h3 className="font-black text-2xl text-slate-800">{students.length}</h3><p className="text-slate-500 text-sm font-semibold uppercase tracking-wider">Siswa Terdaftar</p></div>
                                    </div>
                                    <div className="modern-card p-6 rounded-[2rem] flex items-center gap-5">
                                        <div className="p-4 bg-indigo-50 text-indigo-600 rounded-2xl"><Icons.Table /></div>
                                        <div><h3 className="font-black text-2xl text-slate-800">{records.length}</h3><p className="text-slate-500 text-sm font-semibold uppercase tracking-wider">Koreksi Selesai</p></div>
                                    </div>
                                    <div className="modern-card p-6 rounded-[2rem] flex items-center gap-5">
                                        <div className="p-4 bg-emerald-50 text-emerald-600 rounded-2xl"><Icons.BookOpen /></div>
                                        <div><h3 className="font-black text-2xl text-slate-800">{subjectsList.length}</h3><p className="text-slate-500 text-sm font-semibold uppercase tracking-wider">Mata Pelajaran</p></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'koreksi' && (
                            <div className="animate-in fade-in">
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                    
                                    <div className="lg:col-span-5 space-y-6">
                                        <div className="modern-card p-6 rounded-[2rem]">
                                            <h3 className="font-bold text-lg mb-6 flex items-center gap-2 text-slate-800"><Icons.User /> Pengaturan Koreksi</h3>
                                            
                                            <div className="space-y-6">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Mata Pelajaran</label>
                                                    <select value={subject} onChange={(e) => setSubject(e.target.value)} className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none font-semibold text-slate-700 transition-all">
                                                        {subjectsList.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Pilih Siswa</label>
                                                    <select value={selectedStudentNisn} onChange={(e) => setSelectedStudentNisn(e.target.value)} className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none font-semibold text-slate-700 transition-all">
                                                        <option value="" disabled>-- Pilih dari Database --</option>
                                                        {students.map(std => <option key={std.nisn} value={std.nisn}>{std.name}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <div className="flex justify-between items-end mb-2">
                                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider">Kunci Jawaban ({subject})</label>
                                                        <span className="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded-full">Terkunci per Mapel</span>
                                                    </div>
                                                    <textarea 
                                                        value={answerKeys[subject] || ''}
                                                        onChange={(e) => setAnswerKeys({...answerKeys, [subject]: e.target.value})}
                                                        placeholder={`Tuliskan kunci jawaban atau rubrik penilaian khusus ${subject}...`}
                                                        className="w-full h-32 p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none resize-none font-medium text-sm text-slate-700 transition-all leading-relaxed"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-7 space-y-6">
                                        <div className="modern-card p-6 rounded-[2rem] h-full flex flex-col">
                                            <div className="flex justify-between items-center mb-6">
                                                <h3 className="font-bold text-lg flex items-center gap-2 text-slate-800"><Icons.Image /> Lembar Jawaban</h3>
                                                {imagePreview && <button onClick={() => {setImagePreview(null); setBase64Image(null);}} className="text-xs font-bold text-red-500 hover:bg-red-50 px-3 py-1 rounded-full transition-colors">Hapus</button>}
                                            </div>
                                            
                                            <input type="file" accept="image/*" ref={fileInputRef} className="hidden" onChange={(e) => handleImageUpload(e, 'exam')} />
                                            
                                            <div onClick={() => triggerFileInput(fileInputRef)} className={`flex-1 min-h-[320px] border-2 border-dashed rounded-3xl flex flex-col items-center justify-center cursor-pointer transition-all ${imagePreview ? 'border-transparent bg-slate-100 p-2' : 'border-slate-300 hover:border-indigo-400 hover:bg-slate-50'}`}>
                                                {imagePreview ? (
                                                    <img src={imagePreview} alt="Preview" className="w-full h-full object-contain rounded-2xl shadow-sm" />
                                                ) : (
                                                    <div className="text-center text-slate-500 space-y-3">
                                                        <div className="w-16 h-16 bg-white shadow-sm border border-slate-100 rounded-full flex items-center justify-center mx-auto mb-2 text-indigo-500"><Icons.UploadCloud /></div>
                                                        <p className="font-bold text-slate-700">Klik untuk Mengunggah Foto</p>
                                                        <p className="text-xs font-medium">Mendukung format JPG & PNG resolusi tinggi</p>
                                                    </div>
                                                )}
                                            </div>

                                            <button 
                                                onClick={gradeExam} 
                                                disabled={loading || !base64Image || !selectedStudentNisn}
                                                className={`mt-6 w-full py-4 rounded-2xl font-bold text-white transition-all duration-300 flex items-center justify-center gap-2 text-lg
                                                    ${loading || !base64Image || !selectedStudentNisn ? 'bg-slate-300 cursor-not-allowed' : 'bg-gradient-to-r from-indigo-600 to-blue-600 hover:-translate-y-1 hover:shadow-[0_10px_20px_-10px_rgba(79,70,229,0.5)] active:scale-[0.98]'}`}
                                            >
                                                {loading ? <><Icons.Loader2 /> Sedang Menganalisis dengan OpenAI...</> : 'Koreksi Otomatis Sekarang'}
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'nilai' && (
                            <div className="modern-card p-6 md:p-8 rounded-[2rem] animate-in fade-in">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-800 flex items-center gap-2">Daftar Nilai Siswa</h2>
                                        <p className="text-sm font-medium text-slate-500 mt-1">Laporan analitis hasil koreksi otomatis AI</p>
                                    </div>
                                    <div className="flex gap-3 w-full md:w-auto">
                                        <select value={subject} onChange={(e) => setSubject(e.target.value)} className="p-3 border border-slate-200 rounded-xl bg-slate-50 font-bold text-sm outline-none focus:ring-2 focus:ring-indigo-500 flex-1 md:flex-none">
                                            {subjectsList.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                        <button onClick={downloadExcel} className="bg-slate-900 hover:bg-slate-800 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 text-sm shadow-md transition-all active:scale-95"><Icons.Download /> Ekspor CSV</button>
                                    </div>
                                </div>

                                <div className="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
                                    <table className="w-full text-left border-collapse whitespace-nowrap">
                                        <thead className="bg-slate-50/80 text-slate-600 text-xs uppercase tracking-wider font-bold">
                                            <tr>
                                                <th className="p-5 border-b border-slate-200">Waktu</th>
                                                <th className="p-5 border-b border-slate-200">NISN</th>
                                                <th className="p-5 border-b border-slate-200">Nama Lengkap</th>
                                                <th className="p-5 border-b border-slate-200 text-center">Nilai</th>
                                                <th className="p-5 border-b border-slate-200 text-center">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {records.filter(r => r.subject === subject).length === 0 ? (
                                                <tr><td colSpan="5" className="p-12 text-center text-slate-400 font-medium">
                                                    <div className="flex flex-col items-center gap-3">
                                                        <div className="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center"><Icons.FileText /></div>

                                                    </div>
                                                </td></tr>
                                            ) : records.filter(r => r.subject === subject).map(record => (
                                                <tr key={record.id} className="hover:bg-slate-50/80 border-b border-slate-100 transition-colors text-sm group">

                                                    <td className="p-5 font-mono text-slate-600">{record.studentId}</td>
                                                    <td className="p-5 font-bold text-slate-800">{record.studentName}</td>
                                                    <td className="p-5 text-center">
                                                        <span className={`px-4 py-1.5 rounded-full font-black text-xs inline-block shadow-sm ${record.score >= 75 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>{record.score}</span>
                                                    </td>
                                                    <td className="p-5 text-center">
                                                        <button onClick={() => setSelectedRecord(record)} className="p-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl hover:text-indigo-600 hover:border-indigo-200 hover:bg-indigo-50 transition-all shadow-sm group-hover:shadow"><Icons.Eye /></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        {}
                        {activeTab === 'database' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-in fade-in">
                                <div className="lg:col-span-1">
                                    <div className="modern-card p-6 rounded-[2rem] sticky top-28">
                                        <h3 className="font-bold text-lg mb-6 flex items-center gap-2 text-slate-800"><Icons.Plus /> Tambah Siswa Baru</h3>
                                        <form onSubmit={(e) => { e.preventDefault(); if(newStudent.nisn && newStudent.name){ setStudents([...students, newStudent]); setNewStudent({nisn:'', name:'', jk:'L'}); showToast('Siswa ditambahkan!'); } }} className="space-y-4">

                                            <button type="submit" className="w-full py-4 mt-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg shadow-slate-900/20 transition-all active:scale-[0.98]">Simpan ke Database</button>

                                </div>
                                <div className="lg:col-span-2">

                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="font-bold text-lg text-slate-800">Master Data Siswa</h3>
                                            <span className="bg-indigo-50 text-indigo-700 px-4 py-1.5 rounded-full text-xs font-black tracking-wide border border-indigo-100">{students.length} Siswa</span>
                                        </div>
                                        <div className="overflow-x-auto max-h-[600px] overflow-y-auto custom-scrollbar rounded-2xl border border-slate-200 shadow-sm">
                                            <table className="w-full text-left border-collapse text-sm">
                                                <thead className="bg-slate-50 sticky top-0 z-10"><tr className="text-slate-500 text-xs uppercase tracking-wider font-bold"><th className="p-4 border-b border-slate-200">No</th><th className="p-4 border-b border-slate-200">NISN</th><th className="p-4 border-b border-slate-200">Nama Siswa</th><th className="p-4 border-b border-slate-200 text-center">L/P</th></tr></thead>
                                                <tbody className="bg-white">
                                                    {students.map((s,i) => (
                                                        <tr key={i} className="border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
                                                            <td className="p-4 text-slate-400 font-bold">{i+1}</td>
                                                            <td className="p-4 font-mono text-slate-600">{s.nisn}</td>
                                                            <td className="p-4 font-bold text-slate-800">{s.name}</td>
                                                            <td className="p-4 text-center"><span className={`px-2.5 py-1 rounded-md text-xs font-bold ${s.jk==='L' ? 'bg-blue-50 text-blue-600' : 'bg-pink-50 text-pink-600'}`}>{s.jk}</span></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.2)]">
                                <div className="bg-white/90 backdrop-blur-md px-8 py-5 border-b border-slate-100 flex justify-between items-center z-10">
                                    <h2 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icons.Settings /> Pengaturan Sistem</h2>
                                    <button onClick={() => setIsSettingsOpen(false)} className="p-2 bg-slate-100 text-slate-500 rounded-full hover:bg-slate-200 hover:text-slate-800 transition-colors"><Icons.X /></button>
                                </div>
                                <div className="p-8 space-y-10 overflow-y-auto custom-scrollbar bg-slate-50/50">
                                    
                                    <section>
                                        <h3 className="text-xs font-black text-indigo-500 uppercase tracking-widest mb-4 flex items-center gap-2">Simulator Tampilan</h3>
                                        <div className="flex gap-4">
                                            <button onClick={() => setViewMode('desktop')} className={`flex-1 p-4 rounded-2xl border-2 flex flex-col items-center gap-3 transition-all bg-white ${viewMode === 'desktop' ? 'border-indigo-500 shadow-md shadow-indigo-100 text-indigo-600' : 'border-slate-200 text-slate-400 hover:border-slate-300'}`}><Icons.Monitor /><span className="text-xs font-bold">Desktop</span></button>
                                            <button onClick={() => setViewMode('tablet')} className={`flex-1 p-4 rounded-2xl border-2 flex flex-col items-center gap-3 transition-all bg-white ${viewMode === 'tablet' ? 'border-indigo-500 shadow-md shadow-indigo-100 text-indigo-600' : 'border-slate-200 text-slate-400 hover:border-slate-300'}`}><Icons.Tablet /><span className="text-xs font-bold">Tablet (11")</span></button>
                                            <button onClick={() => setViewMode('mobile')} className={`flex-1 p-4 rounded-2xl border-2 flex flex-col items-center gap-3 transition-all bg-white ${viewMode === 'mobile' ? 'border-indigo-500 shadow-md shadow-indigo-100 text-indigo-600' : 'border-slate-200 text-slate-400 hover:border-slate-300'}`}><Icons.Smartphone /><span className="text-xs font-bold">Mobile</span></button>
                                        </div>
                                    </section>

                                    <section>
                                        <h3 className="text-xs font-black text-indigo-500 uppercase tracking-widest mb-4">Identitas Sekolah</h3>
                                        <div className="grid grid-cols-2 gap-5 mb-5">
                                            <div><label className="block text-xs font-bold text-slate-500 mb-1.5">Nama Sekolah</label><input type="text" value={settings.schoolName} onChange={e => setSettings({...settings, schoolName: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition-all" /></div>
                                            <div><label className="block text-xs font-bold text-slate-500 mb-1.5">Nama Guru</label><input type="text" value={settings.teacherName} onChange={e => setSettings({...settings, teacherName: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition-all" /></div>
                                            <div><label className="block text-xs font-bold text-slate-500 mb-1.5">Tahun Pelajaran</label><input type="text" value={settings.schoolYear} onChange={e => setSettings({...settings, schoolYear: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition-all" /></div>
                                            <div><label className="block text-xs font-bold text-slate-500 mb-1.5">Kelas</label><input type="text" value={settings.grade} onChange={e => setSettings({...settings, grade: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition-all" /></div>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <input type="file" accept="image/*" ref={logoInputRef} className="hidden" onChange={(e) => handleImageUpload(e, 'logo')} />
                                                <button onClick={() => triggerFileInput(logoInputRef)} className="w-full p-3.5 border-2 border-dashed border-slate-300 bg-white rounded-xl text-sm font-bold text-slate-600 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center gap-2"><Icons.Image /> Unggah Logo</button>
                                            </div>
                                            <div className="flex-1">
                                                <input type="file" accept="image/*" ref={bgInputRef} className="hidden" onChange={(e) => handleImageUpload(e, 'bg')} />
                                                <button onClick={() => triggerFileInput(bgInputRef)} className="w-full p-3.5 border-2 border-dashed border-slate-300 bg-white rounded-xl text-sm font-bold text-slate-600 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center gap-2"><Icons.Image /> Unggah Latar</button>
                                            </div>
                                        </div>
                                    </section>
                                    
                                    <section>
                                        <h3 className="text-xs font-black text-indigo-500 uppercase tracking-widest mb-4">Keamanan & Pencadangan</h3>
                                        
                                        <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-xl mb-4 text-xs font-medium text-indigo-800">
                                            Sistem ini menggunakan OpenAI API (ChatGPT). Jika API Key tidak berfungsi, Anda bisa membuat atau memeriksa kuota di <a href="https://platform.openai.com/api-keys" target="_blank" className="font-bold underline text-indigo-600">Platform OpenAI</a>. (Format yang benar: sk-...)
                                        </div>

                                        <div><label className="block text-xs font-bold text-slate-500 mb-1.5">OpenAI API Key</label><input type="password" value={settings.apiKey} onChange={e => setSettings({...settings, apiKey: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-mono focus:ring-2 focus:ring-indigo-500 outline-none transition-all" /></div>
                                        
                                        <div className="flex flex-col sm:flex-row gap-4 mt-5">
                                            <button onClick={backupData} className="flex-1 p-4 bg-slate-800 text-white rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg hover:bg-slate-900 transition-all active:scale-[0.98]"><Icons.Download /> Unduh Backup</button>
                                            
                                            <input type="file" accept=".json" ref={restoreInputRef} className="hidden" onChange={handleRestoreData} />
                                            <button onClick={() => triggerFileInput(restoreInputRef)} className="flex-1 p-4 bg-indigo-100 text-indigo-700 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-sm hover:bg-indigo-200 transition-all active:scale-[0.98]"><Icons.UploadCloud /> Restore Data</button>
                                        </div>
                                    </section>
                                </div>
                                
                                <div className="bg-white/90 backdrop-blur-md px-8 py-5 border-t border-slate-100 flex justify-end gap-4 z-10">
                                    <button onClick={() => setIsSettingsOpen(false)} className="px-6 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition-colors">Batal</button>
                                    <button 
                                        onClick={() => { 
                                            setIsSettingsOpen(false); 
                                            showToast('Pengaturan & API Key berhasil disimpan!'); 
                                        }} 
                                        className="px-6 py-3 rounded-xl font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-500/30 transition-all active:scale-[0.98] flex items-center gap-2"
                                    >
                                        <Icons.Check /> Simpan Pengaturan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {selectedRecord && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white w-full max-w-3xl max-h-[90vh] flex flex-col rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.2)] overflow-hidden">
                                <div className="bg-slate-50/80 px-8 py-5 border-b border-slate-100 flex justify-between items-center backdrop-blur-md z-10">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-800 tracking-tight">{selectedRecord.studentName}</h2>
                                        <p className="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1">Laporan • {selectedRecord.subject} • {selectedRecord.timestamp}</p>
                                    </div>
                                    <button onClick={() => setSelectedRecord(null)} className="p-2 bg-slate-200/80 text-slate-600 rounded-full hover:bg-slate-300 hover:text-slate-900 transition-colors"><Icons.X /></button>
                                </div>
                                <div className="flex-1 p-8 overflow-y-auto custom-scrollbar bg-white">
                                    <div className="flex flex-col items-center justify-center mb-10">
                                        <div className="text-center">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Nilai Akhir Analisis AI</p>
                                            <div className="relative inline-block">
                                                <div className={`absolute inset-0 blur-xl opacity-30 rounded-full ${selectedRecord.score >= 75 ? 'bg-emerald-500' : 'bg-rose-500'}`}></div>
                                                <div className={`relative text-8xl font-black tracking-tighter drop-shadow-sm ${selectedRecord.score >= 75 ? 'text-emerald-500' : 'text-rose-500'}`}>{selectedRecord.score}</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="prose prose-slate max-w-none text-sm font-medium whitespace-pre-wrap bg-[#f8fafc] p-8 rounded-3xl border border-slate-100 shadow-inner text-slate-700 leading-relaxed">
                                        {selectedRecord.feedback}
                                    </div>
                                </div>
                                <div className="p-6 border-t border-slate-100 bg-slate-50/80">
                                    <button onClick={() => downloadWord(selectedRecord)} className="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-2xl font-bold shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 transition-all active:scale-[0.98]"><Icons.Download /> Unduh Laporan Detail (MS Word)</button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
