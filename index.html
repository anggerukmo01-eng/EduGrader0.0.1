        function App() {
            // Settings & Tabs
            const [apiKey, setApiKey] = useState(defaultApiKey);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [tempApiKey, setTempApiKey] = useState('');
            const [activeTab, setActiveTab] = useState('koreksi'); // 'koreksi', 'database', 'daftarnilai'

            // School & Student Data
            const [schoolInfo, setSchoolInfo] = useState({ name: 'SD Negeri 1 Gerduren', year: '2025/2026', grade: '1' });
            const [students, setStudents] = useState(defaultStudents);
            const [newStudent, setNewStudent] = useState({ nisn: '', name: '', jk: 'L' });

            // Grading State
            const [subject, setSubject] = useState('PPKn');
            const [selectedStudentNisn, setSelectedStudentNisn] = useState('');
            const [answerKeys, setAnswerKeys] = useState({}); // Terkunci per mapel
            const [imagePreview, setImagePreview] = useState(null);
            const [base64Image, setBase64Image] = useState(null);
            const [mimeType, setMimeType] = useState(null);
            
            // Process State
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [records, setRecords] = useState([]);
            
            // Report & Filter State
            const [reportSubject, setReportSubject] = useState('Semua');
            const [selectedRecord, setSelectedRecord] = useState(null); // State untuk detail popup
            
            const fileInputRef = useRef(null);
            const restoreInputRef = useRef(null);

            useEffect(() => {
                const savedKey = localStorage.getItem('geminiApiKey');
                if (savedKey) setApiKey(savedKey);
            }, []);

            const saveApiKey = () => {
                const keyToSave = tempApiKey.trim() || defaultApiKey;
                localStorage.setItem('geminiApiKey', keyToSave);
                setApiKey(keyToSave);
                alert("API Key berhasil disimpan!");
            };

            const openSettings = () => {
                setTempApiKey(apiKey === defaultApiKey ? '' : apiKey);
                setIsSettingsOpen(true);
            };

            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStudent.nisn || !newStudent.name) return;
                setStudents([...students, newStudent]);
                setNewStudent({ nisn: '', name: '', jk: 'L' });
            };

            const handleBackup = () => {
                const data = { schoolInfo, students, records, answerKeys };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `Backup_EduGrader_${schoolInfo.name.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleRestore = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.schoolInfo) setSchoolInfo(data.schoolInfo);
                        if (data.students) setStudents(data.students);
                        if (data.records) setRecords(data.records);
                        if (data.answerKeys) setAnswerKeys(data.answerKeys);
                        alert('Data berhasil dipulihkan dari file backup!');
                        setIsSettingsOpen(false);
                    } catch (err) {
                        alert('Format file backup tidak valid!');
                    }
                };
                reader.readAsText(file);
                e.target.value = null; 
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    setError('Unggah file gambar yang valid (JPG/PNG).');
                    return;
                }
                setMimeType(file.type);
                setError(null);
                setResult(null);

                const reader = new FileReader();
                reader.onloadend = () => {
                    setImagePreview(reader.result);
                    setBase64Image(reader.result.split(',')[1]);
                };
                reader.readAsDataURL(file);
            };

            const triggerFileInput = () => fileInputRef.current.click();

            const downloadExcel = () => {
                const filteredRecords = records.filter(r => reportSubject === 'Semua' || r.subject === reportSubject);
                if (filteredRecords.length === 0) return alert("Tidak ada data untuk diunduh pada filter ini.");
                
                const headers = ['Sekolah', 'Tahun Pelajaran', 'Kelas', 'Waktu', 'Mata Pelajaran', 'NISN', 'Nama Siswa', 'Nilai Akhir'];
                const csvContent = [
                    headers.join(','),
                    ...filteredRecords.map(r => `"${r.schoolName}","${r.academicYear}","${r.gradeClass}","${r.timestamp}","${r.subject}","${r.studentId}","${r.studentName}","${r.score}"`)
                ].join('\n');
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `Rekap_Nilai_${schoolInfo.name.replace(/\s+/g, '_')}_${reportSubject}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Fungsi untuk mengunduh laporan detail per siswa ke dalam format Word/Doc
            const downloadStudentDoc = (record) => {
                const htmlContent = `
                    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                    <head><meta charset='utf-8'><title>Hasil Koreksi Siswa</title></head>
                    <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
                        <h2 style="text-align: center; color: #1e3a8a;">Laporan Hasil Evaluasi Pembelajaran</h2>
                        <hr style="border: 1px solid #ccc; margin-bottom: 20px;" />
                        
                        <table style="width: 100%; margin-bottom: 25px; border-collapse: collapse;">
                            <tr>
                                <td style="width: 20%; padding: 5px 0;"><b>Nama Siswa</b></td><td style="width: 30%;">: ${record.studentName}</td>
                                <td style="width: 20%; padding: 5px 0;"><b>Sekolah</b></td><td style="width: 30%;">: ${record.schoolName}</td>
                            </tr>
                            <tr>
                                <td style="padding: 5px 0;"><b>NISN</b></td><td>: ${record.studentId}</td>
                                <td style="padding: 5px 0;"><b>Kelas</b></td><td>: ${record.gradeClass}</td>
                            </tr>
                            <tr>
                                <td style="padding: 5px 0;"><b>Mata Pelajaran</b></td><td>: ${record.subject}</td>
                                <td style="padding: 5px 0;"><b>Tahun Ajaran</b></td><td>: ${record.academicYear}</td>
                            </tr>
                            <tr>
                                <td style="padding: 5px 0;"><b>Waktu Koreksi</b></td><td>: ${record.timestamp}</td>
                                <td></td><td></td>
                            </tr>
                        </table>
                        
                        <div style="background-color: #f0fdf4; padding: 15px; border-left: 5px solid #22c55e; margin-bottom: 30px;">
                            <h1 style="margin: 0; color: #166534; font-size: 24px;">NILAI AKHIR: ${record.score}</h1>
                        </div>
                        
                        <h3 style="color: #1e3a8a; border-bottom: 1px solid #eee; padding-bottom: 5px;">Rincian Analisis & Saran</h3>
                        <div style="white-space: pre-wrap; font-size: 14px;">${record.aiAnalysis ? record.aiAnalysis.replace(/\n/g, '<br/>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') : 'Tidak ada catatan analisis untuk riwayat ini.'}</div>
                        
                        <br/><br/><br/>
                        <table style="width: 100%; margin-top: 50px;">
                            <tr>
                                <td style="width: 60%;"></td>
                                <td style="text-align: center;">
                                    Mengetahui,<br/>Guru Mata Pelajaran<br/><br/><br/><br/>
                                    ________________________
                                </td>
                            </tr>
                        </table>
                    </body>
                    </html>
                `;
                
                const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `Hasil_Evaluasi_${record.studentName.replace(/\s+/g, '_')}_${record.subject}.doc`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const gradeExam = async () => {
                if (!base64Image) return setError('Unggah foto jawaban siswa terlebih dahulu.');
                if (!selectedStudentNisn) return setError('Pilih nama siswa dari daftar.');

                setLoading(true); setError(null); setResult(null);

                const currentAnswerKey = answerKeys[subject] || '';
                const prompt = `Kamu adalah guru ahli mapel ${subject}. Koreksi lembar jawaban siswa dari gambar ini secara teliti.
Kunci & Kriteria: ${currentAnswerKey ? currentAnswerKey : "Gunakan standar keilmuan yang tepat."}
Tugas:
1. Baca teks/jawaban pada gambar dengan teliti.
2. Bandingkan dengan kunci jawaban.
3. Berikan penilaian.

PENTING: Di baris paling awal, WAJIB tulis format ini persis: NILAI_AKHIR: [angka 0-100]. Contoh: NILAI_AKHIR: 85

Setelah itu, berikan laporan mendetail dengan format berikut (gunakan markdown untuk tebal **teks**):
**[ANALISIS JAWABAN]**
- Rincikan soal mana saja yang dijawab BENAR oleh siswa beserta alasannya secara singkat.
- Rincikan soal mana saja yang dijawab SALAH oleh siswa, dan berikan koreksi jawaban yang seharusnya.

**[SARAN PERBAIKAN]**
- Berikan saran membangun untuk siswa berdasarkan hasil koreksinya agar lebih baik ke depannya.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: mimeType, data: base64Image } }] }]
                        })
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();

                    if (data?.candidates?.[0]?.content?.parts?.[0]?.text) {
                        const textResponse = data.candidates[0].content.parts[0].text;
                        setResult(textResponse);
                        
                        const scoreMatch = textResponse.match(/NILAI_AKHIR[^\d]*(\d+)/i);
                        const score = scoreMatch ? parseInt(scoreMatch[1], 10) : 'N/A';
                        const selectedStudent = students.find(s => s.nisn === selectedStudentNisn);
                        
                        // Simpan seluruh textResponse ke dalam aiAnalysis agar bisa dilihat nanti
                        setRecords(prev => [{
                            id: Date.now(),
                            studentName: selectedStudent?.name || 'Unknown',
                            studentId: selectedStudentNisn,
                            subject, score,
                            aiAnalysis: textResponse, 
                            timestamp: new Date().toLocaleString('id-ID'),
                            schoolName: schoolInfo.name,
                            academicYear: schoolInfo.year,
                            gradeClass: schoolInfo.grade
                        }, ...prev]);
                    } else throw new Error("Respon API tidak valid.");
                } catch (err) {
                    setError("Gagal menghubungi AI. Periksa koneksi internet atau API Key Anda.");
                } finally {
                    setLoading(false);
                }
            };

            const formatMarkdown = (text) => {
                if (!text) return { __html: '' };
                const formatted = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-800">$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em class="italic">$1</em>')
                    .replace(/\n/g, '<br/>');
                return { __html: formatted };
            };

            return (

                                <div className="glass-panel rounded-3xl p-6 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-brand-500"></div>
                                    <h2 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-5 flex items-center gap-2"><Icons.School /> Identitas Lembaga</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Nama Sekolah</label><input type="text" value={schoolInfo.name} onChange={e => setSchoolInfo({...schoolInfo, name: e.target.value})} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none font-semibold text-slate-700 transition-all"/></div>
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Tahun Pelajaran</label><input type="text" value={schoolInfo.year} onChange={e => setSchoolInfo({...schoolInfo, year: e.target.value})} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none font-semibold text-slate-700 transition-all"/></div>
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Kelas</label><input type="text" value={schoolInfo.grade} onChange={e => setSchoolInfo({...schoolInfo, grade: e.target.value})} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none font-semibold text-slate-700 transition-all"/></div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                    <div className="lg:col-span-4">
                                        <div className="glass-panel rounded-3xl p-6 sticky top-28">
                                            <h2 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-5 flex items-center gap-2"><Icons.Plus /> Tambah Data Siswa</h2>
                                            <form onSubmit={handleAddStudent} className="space-y-4">
                                                <div><label className="block text-xs font-bold text-slate-500 mb-1.5">NISN</label><input required type="text" placeholder="Contoh: 0123456" value={newStudent.nisn} onChange={e => setNewStudent({...newStudent, nisn: e.target.value})} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500/20 outline-none font-medium text-slate-700"/></div>
                                                <div><label className="block text-xs font-bold text-slate-500 mb-1.5">Nama Lengkap</label><input required type="text" placeholder="Masukkan nama..." value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value.toUpperCase()})} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500/20 outline-none font-medium text-slate-700"/></div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 mb-1.5">Jenis Kelamin</label>
                                                    <select value={newStudent.jk} onChange={e => setNewStudent({...newStudent, jk: e.target.value})} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500/20 outline-none font-medium text-slate-700 cursor-pointer">
                                                        <option value="L">Laki-laki (L)</option><option value="P">Perempuan (P)</option>
                                                    </select>
                                                </div>
                                                <button type="submit" className="w-full mt-2 py-3.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold transition-all shadow-md hover:shadow-lg">Simpan ke Database</button>
                                            </form>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-8">
                                        <div className="glass-panel rounded-3xl p-6">
                                            <div className="flex justify-between items-center mb-6">
                                                <h2 className="text-sm font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2"><Icons.Database /> Master Data Siswa</h2>
                                                <div className="bg-brand-100 text-brand-700 px-3 py-1 rounded-full text-xs font-extrabold">{students.length} Terdaftar</div>
                                            </div>
                                            <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm">
                                                <div className="overflow-x-auto overflow-y-auto max-h-[500px] custom-scrollbar">
                                                    <table className="w-full text-left border-collapse">
                                                        <thead className="sticky top-0 bg-slate-50/95 backdrop-blur-sm z-10">
                                                            <tr className="text-slate-500 text-xs uppercase tracking-wider border-b border-slate-100">
                                                                <th className="p-4 font-bold">No</th>
                                                                <th className="p-4 font-bold">NISN</th>
                                                                <th className="p-4 font-bold">Nama Lengkap</th>
                                                                <th className="p-4 font-bold text-center">Gender</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="text-sm font-medium text-slate-700">
                                                            {students.map((std, idx) => (
                                                                <tr key={idx} className="border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
                                                                    <td className="p-4 text-slate-400">{idx + 1}</td>
                                                                    <td className="p-4 font-mono text-xs text-slate-500">{std.nisn}</td>
                                                                    <td className="p-4 font-bold text-slate-800">{std.name}</td>
                                                                    <td className="p-4 text-center">
                                                                        <span className={`inline-flex w-8 h-8 items-center justify-center rounded-lg font-bold text-xs ${std.jk === 'L' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}`}>{std.jk}</span>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
